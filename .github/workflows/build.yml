name: build-and-release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [main]
    paths:
      - package.nix
      - flake.nix
      - flake.lock

permissions:
  contents: write

env:
  # Cache lives at https://app.cachix.org/cache/wpewebkit-bin; its write token
  # must be set as the CACHIX_AUTH_TOKEN repository secret. The matching
  # public key is in flake.nix's nixConfig.
  CACHIX_CACHE: wpewebkit-bin

jobs:
  build-x86_64-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo docker image prune -af || true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # Pushes every store path realised below, so consumers substitute both the
      # from-source build and the repacked prebuilt instead of doing either.
      - name: Set up Cachix
        uses: cachix/cachix-action@v16
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build wpewebkit from source
        run: nix build '.#wpewebkit-source^*' --print-build-logs -o result

      - name: Package tarball
        id: package
        run: |
          version=$(nix eval --raw .#wpewebkit-source.version)
          tarball="wpewebkit-${version}-x86_64-linux.tar.gz"
          merged=$(mktemp -d)
          for out in result result-*; do
            [ -e "$out" ] && cp -rL --no-preserve=mode "$out"/. "$merged"/
          done
          tar -czf "$tarball" -C "$merged" .
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Compute nix-compatible hash
        id: hash
        run: |
          hash=$(nix hash file --sri "${{ steps.package.outputs.tarball }}")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.package.outputs.version }}"
          gh release delete "$tag" --yes || true
          gh release create "$tag" "${{ steps.package.outputs.tarball }}" \
            --title "wpewebkit ${{ steps.package.outputs.version }}" \
            --notes "Prebuilt wpewebkit ${{ steps.package.outputs.version }} for x86_64-linux, built from package.nix in this repo."

      - name: Update versions.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/v${{ steps.package.outputs.version }}/${{ steps.package.outputs.tarball }}"
          jq --arg url "$url" \
             --arg hash "${{ steps.hash.outputs.hash }}" \
             --arg version "${{ steps.package.outputs.version }}" \
             '.version = $version | .["x86_64-linux"] = {url: $url, hash: $hash}' \
             versions.json > versions.json.tmp
          mv versions.json.tmp versions.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git diff --cached --quiet || git commit -m "ci: publish wpewebkit ${{ steps.package.outputs.version }} for x86_64-linux"
          git push

      # versions.json now points at the release published above, so `.#wpewebkit`
      # resolves to the prebuilt repack. Realise it here purely so cachix-action
      # uploads it: that is the path consumers actually depend on, and building it
      # locally means unpacking 223 MB and rewriting a 173 MB library.
      - name: Build and push the repacked prebuilt
        run: nix build '.#wpewebkit' --print-build-logs --no-link
